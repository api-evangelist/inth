description: >-
  c15t does not ship a payments-style sandbox with test cards. Its testing/dev
  surface is the "offline" client mode plus the setup CLI. Offline mode runs the
  full consent UX with no backend, for local development, demos, previews, static
  sites, and controlled fallback. No test key prefixes or fixture tokens are
  published (secret keys use the sk_live_ prefix).
