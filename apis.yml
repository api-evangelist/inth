aid: inth
name: Inth
description: >-
  Inth is a San Francisco, Y Combinator-backed company building enterprise
  privacy governance for teams that ship fast, making consent programmable,
  observable, and compliant by default. Its foundation is c15t (github.com/c15t),
  an open-source, developer-first consent management platform with 3M+ npm
  downloads used by teams like Zed, Expo, Infisical, and Unkey. c15t provides a
  headless, composable cookie banner, consent manager, and preference center for
  JavaScript, React, and Next.js, plus a self-hostable consent backend and REST
  API (@c15t/backend) that also runs as the inth.com managed service. It supports
  GDPR, CCPA, LGPD, IAB TCF 2.3, Google Consent Mode v2, and Global Privacy
  Control, with regional policy packs, audit-ready consent records, script and
  iframe gating, and first-party SDKs and CLI.
