openapi: 3.2.0
info:
  title: c15t Consent Backend Legal Documents API
  version: 2.1.0
  description: REST API for the c15t consent backend (@c15t/backend) that powers the c15t cookie banner, consent manager, and preference center.
  contact:
    name: c15t
    url: https://c15t.com/docs/self-host
  license:
    name: GPL-3.0
    url: https://github.com/c15t/c15t/blob/main/LICENSE.md
servers:
- url: https://your-instance.c15t.dev
  description: Hosted c15t backend instance (per-tenant subdomain). Self-hosted deployments mount the same routes under a configurable basePath (e.g. /api/c15t).
security:
- bearerAuth: []
tags:
- name: Legal Documents
paths:
  /legal-documents/{type}/current:
    put:
      tags:
      - Legal Documents
      operationId: syncLegalDocument
      summary: Sync the current legal document release (API key required)
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Legal document release synced.
        '401':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key passed as a Bearer token in the Authorization header (e.g. `Authorization: Bearer sk_live_...`). Public endpoints (init, status) require no credential.'
